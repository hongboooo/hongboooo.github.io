eyebrow: "Research"
headline: "Intelli-Embodied Design Space"
introduction: |
  I study how people can work with generative AI and extended reality across ideation,
  prototyping, situated understanding, and collaborative making. I build systems that connect
  digital and physical materials while preserving human agency, legibility, and control.

